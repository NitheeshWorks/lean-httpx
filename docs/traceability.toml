# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "httpx and httpcore"
upstream_url = "https://github.com/encode/httpx"
upstream_commit = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
upstream_license = "BSD-3-Clause"

[[requirement]]
id = "url.parse"
upstream = "tests/models/test_url.py::test_complete_url"
title = "URL parsing and normalisation (scheme, userinfo, host, port, path, query, fragment)"
status = "implemented"
realises = ["LeanHttpx.URL.parse", "LeanHttpx.URLParse.build", "LeanHttpx.URLParse.splitUrl", "LeanHttpx.URLParse.splitAuth"]
theorem = ["LeanHttpx.url_parse_print_ext", "LeanHttpx.URLParse.splitUrl_printRaw", "LeanHttpx.URLParse.splitAuth_printAuth"]
test = ["tests/Conformance.lean::complete url", "tests/Props.lean::URL.parse never reaches its internal canonical-form check"]

[[requirement]]
