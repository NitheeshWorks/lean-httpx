[[requirement]]
id = "hpack.huffman"
upstream = "hpack 4.2.0 hpack/huffman.py, hpack/huffman_table.py (decode_huffman)"
title = "Huffman code of RFC 7541 appendix B, canonical from its code lengths; EOS, long codes and bad padding refused"
status = "tested"
realises = ["LeanHttpx.Huffman.encode", "LeanHttpx.Huffman.decode", "LeanHttpx.Huffman.codes"]
test = ["tests/Conformance.lean::h2 golden huffman", "tests/Props.lean::Huffman: decode (encode b) = b"]

[[requirement]]
id = "h2.connection"
upstream = "httpcore tests/_sync/test_http2.py::test_http2_connection"
title = "HTTP/2 client connection: preface, settings, streams, flow control, 1xx, trailers, RST_STREAM, GOAWAY"
status = "tested"
realises = ["LeanHttpx.H2.Conn.new", "LeanHttpx.H2.Conn.startRequest", "LeanHttpx.H2.Conn.receive", "LeanHttpx.H2.Conn.outcome", "LeanHttpx.H2.Conn.onFrame"]
test = ["tests/Conformance.lean::a response", "tests/Conformance.lean::a request body", "tests/Conformance.lean::reset stream, connection reusable", "tests/Conformance.lean::GOAWAY, connection not reusable", "tests/Conformance.lean::a body larger than the initial window", "tests/Conformance.lean::MAX_CONCURRENT_STREAMS updates", "tests/Conformance.lean::100 then 200", "tests/Props.lean::HTTP/2: a response is the same however the bytes arrive"]

[[requirement]]
id = "h2.validation"
upstream = "h2 tests/test_invalid_headers.py::TestInvalidFrameSequences::test_headers_event"
title = "Response fields checked as h2 checks them (RFC 9113 8.2, 8.3): names, values, connection-specific fields, te, pseudo-headers, trailers"
status = "tested"
realises = ["LeanHttpx.H2.Conn.badField", "LeanHttpx.H2.Conn.responseHead", "LeanHttpx.H2.Conn.trailerCheck"]
test = ["tests/Conformance.lean::invalid response fields", "tests/Conformance.lean::late pseudo-header", "tests/Conformance.lean::te: trailers", "tests/Conformance.lean::pseudo-header in trailers"]

[[requirement]]
id = "h2.settings"
upstream = "h2 tests/test_invalid_frame_sequences.py::TestInvalidFrameSequences::test_reject_invalid_settings_values"
title = "SETTINGS validation (ENABLE_PUSH from a server, INITIAL_WINDOW_SIZE, MAX_FRAME_SIZE) and window overflow"
status = "tested"
realises = ["LeanHttpx.H2.Conn.onFrame"]
test = ["tests/Conformance.lean::invalid SETTINGS values", "tests/Conformance.lean::server ENABLE_PUSH 1", "tests/Conformance.lean::connection window overflow", "tests/Conformance.lean::stream window overflow resets the stream", "tests/Conformance.lean::SETTINGS overflows a stream window", "tests/NativeH2.lean::/window-overflow"]

[[requirement]]
id = "h2.floods"
upstream = "h2 tests/test_invalid_frame_sequences.py::TestInvalidFrameSequences::test_prevent_continuation_dos"
title = "Hostile peers: CONTINUATION floods, header blocks, PING and SETTINGS floods, rapid reset, unread output, all bounded (Limits)"
status = "deviation"
realises = ["LeanHttpx.H2.Limits", "LeanHttpx.H2.Conn.control", "LeanHttpx.H2.Conn.progress"]
test = ["tests/Conformance.lean::CONTINUATION flood", "tests/NativeH2.lean::/continuation-flood", "tests/NativeH2.lean::/ping-flood", "tests/NativeH2.lean::/settings-flood", "tests/NativeH2.lean::/rst-flood", "tests/NativeH2.lean::/hpack-bomb"]

[[requirement]]
id = "h2.concurrency"
upstream = "httpcore tests/_sync/test_http2.py::test_http2_remote_max_streams_update"
title = "Concurrent streams bounded by min(our MAX_CONCURRENT_STREAMS 100, the peer's); requests multiplexed on one connection"
status = "tested"
realises = ["LeanHttpx.H2.Conn.canStart", "LeanHttpx.H2Pool", "LeanHttpx.H2Link.start"]
test = ["tests/Conformance.lean::MAX_CONCURRENT_STREAMS updates", "tests/NativeH2.lean::multiplexed"]

[[requirement]]
id = "h2.transport"
upstream = "httpx tests/client/test_client.py (Client(http2=True)); httpcore/_sync/http2.py"
title = "Client.new (http1 := false) (http2 := true): HTTP/2 with prior knowledge over TCP, errors as httpx classes, body memory and time bounded"
status = "deviation"
realises = ["LeanHttpx.HTTP2Transport.new", "LeanHttpx.httpTransport", "LeanHttpx.h2Fields", "LeanHttpx.Client.new"]
test = ["tests/NativeH2.lean::/ok", "tests/NativeH2.lean::bench", "tests/Props.lean::HTTP/2: request fields are pseudo-headers then lower-case fields, credentials never indexed"]
