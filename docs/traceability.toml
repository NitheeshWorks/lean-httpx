realises = ["LeanHttpx.URL.toString"]
theorem = ["LeanHttpx.url_parse_print_ext"]
test = ["tests/Conformance.lean::url equality", "tests/Props.lean::URL.parse (toString (URL.parse s)) is URL.parse s (theorem url_parse_print_ext, on text)"]

